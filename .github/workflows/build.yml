name: Build custom Replay Mod 26.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out this fork (only needed to get the patch)
        uses: actions/checkout@v4

      # Gradle itself must run on Java 21 (the Java downgrader used by ReplayStudio cannot read Java 25 classes),
      # the last JDK listed becomes the default. Minecraft 26.x is compiled with Java 25 through Gradle toolchains.
      - name: Set up JDKs (8, 17, 25 and finally 21 as the default)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21

      - name: Get the official Replay Mod 2.6.28 source and apply the patch
        run: |
          cp replaymod-26.3-custom.patch /tmp/custom.patch
          git clone https://github.com/ReplayMod/ReplayMod /tmp/rm
          cd /tmp/rm
          git checkout 13ca34329be20fd3f3d2b2ccb4512c7d3f028871
          git submodule update --init --recursive
          git apply --verbose /tmp/custom.patch
          # Minecraft 26.2/26.3 need libraries that only Mojang's repository has
          sed -i '0,/    mavenLocal()/s||    mavenLocal()\n    maven("https://libraries.minecraft.net/")|' build.gradle.kts
          sed -n 38,46p build.gradle.kts

      - name: Build Replay Mod for 26.3
        shell: bash
        working-directory: /tmp/rm
        run: ./gradlew :26.3:bundleJar --no-daemon --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 2>&1 | tee /tmp/build.log

      - name: Show only the errors (copy this step's output if the build failed)
        if: failure()
        shell: bash
        run: |
          echo "=== compile errors ==="
          grep -n -B1 -A4 -E "error:|error\[|\.java:[0-9]+: " /tmp/build.log | head -200
          echo "=== what went wrong ==="
          grep -n -A12 "What went wrong" /tmp/build.log | head -60

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: replaymod-26.3-custom
          path: /tmp/rm/versions/26.3/build/libs/*.jar
