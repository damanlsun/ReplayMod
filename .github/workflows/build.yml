name: Build custom Replay Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Keep the patch, switch to the Replay Mod 2.6.15 source
        run: |
          cp replaymod-1.19.2-custom.patch /tmp/custom.patch
          git checkout -f 706d46f6
          git submodule update --init --recursive

      - name: Apply patch
        run: git apply --verbose /tmp/custom.patch

      - name: Fix 1.16.4 method name (safe even if the patch already has it)
        run: |
          sed -i 's/instance\.isRelative()/instance.isLooping()/' src/main/java/com/replaymod/render/mixin/Mixin_RecordSounds.java
          grep -n "isLooping\|isRelative" src/main/java/com/replaymod/render/mixin/Mixin_RecordSounds.java

      - name: Build the preprocessor plugin locally (the JitPack copy is missing)
        run: |
          git clone https://github.com/ReplayMod/preprocessor /tmp/preprocessor
          cd /tmp/preprocessor
          git checkout 48e02ad
          sed -i 's/version = "SNAPSHOT"/version = "48e02ad"/' build.gradle.kts
          ./gradlew publishToMavenLocal --no-daemon --stacktrace

      - name: Build Replay Mod
        shell: bash
        run: ./gradlew :1.19.2:bundleJar --no-daemon 2>&1 | tee build.log

      - name: Show only the errors (copy this step's output if the build failed)
        if: failure()
        shell: bash
        run: |
          echo "=== compile errors ==="
          grep -n -B1 -A4 -E "error:|error\[|\.java:[0-9]+: " build.log | head -150
          echo "=== what went wrong ==="
          grep -n -A12 "What went wrong" build.log | head -60

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: replaymod-1.19.2-custom
          path: versions/1.19.2/build/libs/*.jar
